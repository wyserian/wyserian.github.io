    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        :root {
            --bg: #0b0d12; --surface: #131820; --surface-2: #1a202a;
            --text: #e9ecf2; --muted: #9ba2af; --dim: #7a8190;
            --accent: #4f8ef7; --accent-btn: #2f6fe0; --term-green: #3ecf8e; --err: #f87171;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        }
        :root[data-theme="light"] {
            --bg: #eceff4; --surface: #ffffff; --surface-2: #e2e7ee;
            --text: #0b1220; --muted: #384152; --dim: #576072;
            --accent: #1f5fd6; --accent-btn: #1f5fd6; --term-green: #11743a; --err: #b91c1c;
        }
        body {
            min-height: 100vh; min-height: 100svh;
            display: grid; place-items: center; padding: 1.25rem;
            background: var(--bg); color: var(--text); font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: radial-gradient(50rem 36rem at 15% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%);
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
        }
        .term { width: min(640px, 100%); border-radius: 14px; background: var(--surface); overflow: hidden; }
        .bar {
            display: flex; align-items: center; gap: 0.45rem; padding: 0.7rem 1rem;
            background: var(--surface-2);
        }
        .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); opacity: 0.5; }
        .bar span { margin-left: 0.5rem; font-family: var(--mono); font-size: 0.75rem; color: var(--dim); }
        .screen {
            padding: 1.4rem 1.3rem 1.5rem;
            font-family: var(--mono); font-size: 0.88rem; line-height: 1.75; color: var(--muted);
        }
        .screen p { word-break: break-all; }
        .u { color: var(--term-green); }
        .pa { color: var(--accent); }
        .cmd { color: var(--text); }
        .err { color: var(--err); }
        .code { margin: 0.9rem 0 0.2rem; font-size: 3.2rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--text); }
        .hint { margin-top: 0.4rem; font-family: var(--sans); font-size: 0.98rem; color: var(--muted); word-break: normal; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.4rem 0 1.2rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.45rem; min-height: 40px; padding: 0 1rem;
            border-radius: 9px; font-family: var(--sans); font-size: 0.88rem; font-weight: 600;
            text-decoration: none; color: #fff; background: var(--accent-btn);
            transition: background 0.2s, transform 0.15s;
        }
        .btn:hover { background: #2861cc; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }
        .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
        .caret {
            display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.18em;
            background: var(--accent); animation: blink 1.05s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .caret { animation: none; } .btn { transition: none; } }

        /* ── leaked server error / debug page ── */
        body.crashed { display: block; padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem); }
        .crash { width: min(980px, 100%); margin: 0 auto; }
        .crash-badge {
            display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px;
            font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.04em;
            color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent);
        }
        .crash h1 { margin-top: 0.9rem; font-family: var(--mono); font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; color: var(--err); letter-spacing: -0.02em; }
        .crash-msg { margin-top: 0.45rem; font-family: var(--mono); font-size: 1rem; color: var(--text); overflow-wrap: anywhere; }
        .crash-meta { margin-top: 0.6rem; font-family: var(--mono); font-size: 0.78rem; color: var(--dim); overflow-wrap: anywhere; }
        .crash section { margin-top: 1.6rem; }
        .crash h2 {
            margin-bottom: 0.55rem; font-family: var(--mono); font-size: 0.74rem; font-weight: 500;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
        }
        .crash h2 b { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
        .panel {
            border-radius: 12px; background: var(--surface); overflow-x: auto;
            font-family: var(--mono); font-size: 0.8rem; line-height: 1.7;
            font-variant-ligatures: none; /* show code as typed: no => or === arrows */
            scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 25%, transparent) transparent;
        }
        :root { color-scheme: dark; }
        :root[data-theme="light"] { color-scheme: light; }
        .panel .row { display: flex; padding: 0 1rem; white-space: pre; }
        .panel .row:first-child { padding-top: 0.7rem; } .panel .row:last-child { padding-bottom: 0.7rem; }
        .stack .row { color: var(--muted); }
        .stack .row.lib { color: var(--dim); opacity: 0.75; }
        .stack .row.top { color: var(--text); }
        .src .ln { flex: none; width: 3ch; margin-right: 1.2rem; text-align: right; color: var(--dim); user-select: none; }
        .src .row { color: var(--muted); }
        .src .row.hl { color: var(--text); background: color-mix(in srgb, var(--err) 16%, transparent); box-shadow: inset 3px 0 0 var(--err); }
        .kv { display: grid; grid-template-columns: minmax(9rem, max-content) 1fr; column-gap: 1.5rem; padding: 0.7rem 1rem; white-space: normal; }
        .kv dt { color: var(--dim); }
        .kv dd { color: var(--text); overflow-wrap: anywhere; }
        .crash-foot { margin: 2rem 0 0.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--dim); }
        @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 0.4rem; } }
    </style>
